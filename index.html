<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->

    <!-- Start fetching the brand mark during HTML parse, before the JS bundle runs. -->
    <link rel="preload" as="image" fetchpriority="high" href="/src/imports/samriddhi-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Inline so the loading screen paints on the first frame, with no extra request. -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 24px;
        background: #fffdf8;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-splash img {
        display: block;
        width: min(230px, 60vw);
        height: auto;
        animation: app-splash-in 0.55s ease both;
      }
      #app-splash .app-splash__bar {
        width: min(176px, 44vw);
        height: 3px;
        border-radius: 999px;
        background: rgba(233, 0, 104, 0.15);
        overflow: hidden;
      }
      #app-splash .app-splash__bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #e90068;
        animation: app-splash-slide 1.15s cubic-bezier(0.65, 0.05, 0.36, 1) infinite;
      }
      #app-splash p {
        margin: 0;
        font: 700 10px/1 "DM Sans", system-ui, -apple-system, sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #55585c;
      }
      #app-splash.app-splash--done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes app-splash-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes app-splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img {
          animation: none;
        }
        #app-splash .app-splash__bar span {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="app-splash" role="status" aria-live="polite">
      <img src="/src/imports/samriddhi-logo.png" alt="" width="851" height="388" fetchpriority="high" />
      <div class="app-splash__bar"><span></span></div>
      <p>Loading</p>
    </div>
    <script>
      // Shared by main.tsx. The timeout is a watchdog so a failed mount can never
      // leave the overlay stuck on top of the page.
      window.__dismissAppSplash = function () {
        var splash = document.getElementById("app-splash");
        if (!splash) return;
        splash.classList.add("app-splash--done");
        setTimeout(function () {
          splash.remove();
        }, 450);
      };
      setTimeout(window.__dismissAppSplash, 6000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
